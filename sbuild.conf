# sbuild configuration for this repo. scripts/build.sh loads it through SBUILD_CONFIG,
# so ~/.sbuildrc is untouched. Perl syntax; the file must end with "1;".

# Build in an unprivileged user namespace from a tarball in ~/.cache/sbuild. No root needed.
$chroot_mode = 'unshare';
# scripts/chroot-create.sh owns the tarball. Never let sbuild re-create it with its own
# (Debian) defaults, which would fail for an Ubuntu series anyway.
$unshare_mmdebstrap_auto_create = 0;
# lintian, piuparts and autopkgtest run outside sbuild (see scripts/build.sh).
$run_lintian = 0;
$run_piuparts = 0;
$run_autopkgtest = 0;
$build_arch_all = 1;
# Unpack the chroot tarball under /var/tmp, on disk. sbuild's default is $TMPDIR/tmp.sbuild.XXXXXXXXXX,
# so /tmp when TMPDIR is unset, and where /tmp is a tmpfs the chroot and the build tree are held in
# RAM. sbuild's own example for this setting (Sbuild/Conf.pm): "Choose /var/tmp if /tmp is too small".
$unshare_tmpdir_template = '/var/tmp/tmp.sbuild.XXXXXXXXXX';
# Echo the build log to standard output as well as to the build/<pkg>_<ver>_amd64-<time>.build
# file. sbuild's default is 1 only when stdin and stdout are terminals, so without this line
# a build whose output goes to a pipe or a file shows nothing of it but "E: Build failure (dpkg-buildpackage died with exit 2)".
$verbose = 1;
1;
