# distro.conf: the single source of truth for the distro's identity.
#
# Shell syntax (KEY=value, ${VAR} references allowed). Read by scripts/render.py, the build
# and publish scripts, and CI. Every file that carries the name is rendered from a *.in
# template with @KEY@ tokens (@@KEY@@ for a literal); never edit a rendered file by hand.
# Rebrand: change the values here, run `make render`, then follow docs/build-infra.md,
# "Rebrand playbook".

# Identifier. Lowercase letters, digits and hyphens. Used for package names, commands,
# paths (/usr/share/<id>, /etc/<id>, ~/.config/<id>), systemd units, and the environment
# variable prefix (uppercased, hyphens to underscores: OAXACA_PATH).
DISTRO_ID=oaxaca
# Display name: /etc/os-release NAME, menus, Plymouth, docs.
DISTRO_NAME=Oaxaca

# Where the project lives. URLs are derived from these.
GITHUB_OWNER=santisbon
GITHUB_REPO=oaxaca
DISTRO_HOME_URL="https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}"
DISTRO_BUG_URL="https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/issues"

# Base and upstream pins (see docs/policy.md).
BASE_SERIES=stonking
BASE_VERSION=26.10
OMARCHY_TAG=v4.0.4
# The tag without its v, for package versions (<omarchy version>-0<id>1, policy section 4).
OMARCHY_VERSION=${OMARCHY_TAG#v}
# The fork of omacom/omarchy that carries the port (branch "oaxaca" on top of OMARCHY_TAG), and
# the ref of it that packages/desktop builds: a branch while the port is developed, a tag once
# a release is cut. scripts/build.sh reads these through packages/desktop/upstream.
OMARCHY_FORK="https://github.com/${GITHUB_OWNER}/omarchy"
OMARCHY_PORT_REF=oaxaca
# The fork commit packages/desktop is built from, named three ways in the desktop packages'
# upstream version, <omarchy version>+git<date>.<count>.<commit> (policy section 4):
#   OMARCHY_PORT_DATE    the commit's date, UTC, YYYYMMDD, for people reading the version
#   OMARCHY_PORT_COUNT   the fork's commits since OMARCHY_TAG (git rev-list --count
#                        OMARCHY_TAG..<commit>); it grows with every commit, so any number of
#                        fork changes in one day get versions that sort in order
#   OMARCHY_PORT_COMMIT  the commit's hash, abbreviated to 8 hex digits (git rev-parse
#                        --short=8), which says exactly which commit the packages hold
# scripts/build.sh fails when the commit it fetches does not match all three, and prints the
# right values. Change them, with a new desktop changelog entry, whenever the fork changes.
OMARCHY_PORT_DATE=20261016
OMARCHY_PORT_COUNT=53
OMARCHY_PORT_COMMIT=d0a9b09a
OMARCHY_PORT_VERSION=${OMARCHY_VERSION}+git${OMARCHY_PORT_DATE}.${OMARCHY_PORT_COUNT}.${OMARCHY_PORT_COMMIT}

# apt repository: an S3 bucket read over HTTPS at its REST endpoint (infra/apt-repo/README.md).
# APT_S3_BUCKET is the bucket's globally unique name and APT_S3_REGION its region; the CloudFormation
# stack that creates the bucket (make apt-infra) and the publish step (make publish) use them, with
# the aws-cli profile APT_AWS_PROFILE (the AWS_PROFILE environment variable overrides it).
# APT_ORIGIN is what apt pins match on ("Pin: release o=Oaxaca").
APT_S3_BUCKET=oaxaca-apt
APT_S3_REGION=us-east-1
APT_AWS_PROFILE=personal
APT_URL="https://${APT_S3_BUCKET}.s3.${APT_S3_REGION}.amazonaws.com"
APT_ORIGIN="${DISTRO_NAME}"
APT_LABEL="${DISTRO_NAME}"
APT_COMPONENT=main

# Archive signing key identity (the user ID on the GPG key). Email is optional.
APT_KEY_NAME="${DISTRO_NAME} Archive Signing Key"
APT_KEY_EMAIL=
# Fingerprint of the current archive key. scripts/keygen.sh fills this in.
APT_KEY_FPR=2A95E0E7A8E14C48320A00EB7C70659F7A4FDC5A

# Maintainer for debian/control and debian/changelog.
MAINTAINER="santisbon <santisbon@users.noreply.github.com>"
