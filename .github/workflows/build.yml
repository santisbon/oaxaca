# Build every package in a clean chroot on each push, pull request and tag.
# Anatomy, three jobs:
#   prepare   one runner: checks that the rendered files still match distro.conf, lists the
#             package directories for the matrix, and creates (or restores from cache) the same
#             chroot tarball scripts/chroot-create.sh makes locally, so the matrix finds it cached.
#   build     one runner per package directory, in parallel. Each job looks for a cache entry keyed
#             on everything that goes into its package (the package directory, distro.conf, the
#             build scripts, the chroot's weekly key). On a hit it restores the built files and
#             builds nothing; on a miss it runs scripts/build.sh for that one package and the
#             cache saves the results when the job succeeds. Every job uploads its files as an
#             artifact named packages-<directory>.
#   upgrade-test  one runner, after build: downloads every packages-* artifact into build/ and
#             runs scripts/upgrade-test.sh, which installs the published versions of those
#             packages in a throwaway chroot, upgrades them to the freshly built ones and runs
#             the migrations for a seeded user (roadmap step 8). The report is uploaded.
#   release   on a v* tag only: downloads every packages-* artifact and attaches the files to a
#             GitHub Release, which is what scripts/repo-publish.sh consumes when publishing from
#             the workstation.
# Why: one job building all 14 packages took 30 min on 2026-10-10, 16 of them quickshell and 6 the
# share picker, on every push. With the cache a push that leaves a package untouched costs that
# package about a minute, and the matrix makes a full rebuild as long as its slowest package.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # sbuild's unshare mode unpacks the chroot and runs the build under $TMPDIR, /tmp by default.
  # On a standard runner /tmp is a 3.9 GB tmpfs (logged by the "Runner disk" step) and quickshell's
  # build needs 4.8 GB there, so on 2026-10-10 its final link died with "lto1: fatal error: write:
  # No space left on device". /var/tmp is on the root disk (18 GB free) and world-writable, and
  # sbuild.conf(5) names it as the choice "if /tmp is too small".
  TMPDIR: /var/tmp
  # A standard runner has 4 CPUs and 16 GB. quickshell's build with four g++ jobs peaks at 12.4 GB
  # of anonymous memory (measured 2026-10-10 under a 16 GB cgroup cap), with two at 1.9 GB.
  # sbuild passes DEB_BUILD_OPTIONS into the chroot.
  DEB_BUILD_OPTIONS: parallel=2

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      week: ${{ steps.week.outputs.week }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history with tags: scripts/version-check.sh compares against the newest v* tag.
          fetch-depth: 0

      - name: Check rendered files match distro.conf
        run: make check-render

      - name: Check changed packages bumped their version
        run: make check-versions

      - name: List package directories
        id: list
        run: echo "packages=$(ls -1 packages | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      - name: Cache key for the chroot (rotates weekly)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap uidmap ubuntu-keyring
          # Ubuntu 24.04+ restricts unprivileged user namespaces through AppArmor; mmdebstrap's unshare mode needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore or create the build chroot
        # Done once here rather than in each matrix job: on a cache miss, creating the chroot takes
        # about 25 minutes and the matrix jobs would otherwise all do it at the same time.
        uses: actions/cache@v6
        with:
          path: ~/.cache/sbuild
          key: sbuild-${{ hashFiles('distro.conf', 'scripts/chroot-create.sh') }}-${{ steps.week.outputs.week }}

      - name: Create build chroot
        run: make chroot

  build:
    needs: prepare
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore this package's last build
        # Key: everything the build reads. A change to any of these, or a new chroot week, means a
        # rebuild; anything else (docs, other packages) restores the files built last time.
        id: built
        uses: actions/cache@v6
        with:
          key: pkg-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/**', matrix.package), 'distro.conf', 'scripts/build.sh', 'scripts/render.py', 'sbuild.conf') }}-${{ needs.prepare.outputs.week }}
          path: |
            build/*.deb
            build/*.ddeb
            build/*.dsc
            build/*.tar.*
            build/*.changes
            build/*.buildinfo
            build/logs

      - name: Install build tools
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          # cargo: scripts/build.sh runs "cargo vendor" on the runner, outside the chroot, for a
          # package whose upstream file sets CARGO_VENDOR=1 (hyprland-preview-share-picker).
          sudo apt-get install -y --no-install-recommends sbuild mmdebstrap uidmap ubuntu-keyring devscripts lintian python3 cargo
          # Ubuntu 24.04+ restricts unprivileged user namespaces through AppArmor; sbuild's unshare mode needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore build chroot
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sbuild
          key: sbuild-${{ hashFiles('distro.conf', 'scripts/chroot-create.sh') }}-${{ needs.prepare.outputs.week }}
          fail-on-cache-miss: true

      - name: Runner disk
        # Recorded in the log because the TMPDIR and parallel settings above depend on it.
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          findmnt -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL / /tmp /var/tmp || true
          df -h / /tmp /var/tmp

      - name: Build the package
        if: steps.built.outputs.cache-hit != 'true'
        run: make build PKG=packages/${{ matrix.package }}

      - name: Collect build logs
        # sbuild writes each build log to build/<pkg>_<ver>_amd64-<ISO 8601 time>.build and a
        # <pkg>_<ver>_amd64.build symlink to the newest; upload-artifact rejects a colon in a file
        # name, so the logs are copied under build/logs/ with the colons replaced. always(): the
        # logs matter most when the build step failed.
        if: always() && steps.built.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/logs
          for f in build/*.build; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            cp "$f" "build/logs/$(basename "$f" | tr ':' '-')"
          done
          ls -1 build/logs || true

      - name: Upload packages and build logs
        # Not build/ as a whole: the git cache, orig downloads and unpacked trees live there too.
        # The build log is also in this job's output, since sbuild.conf sets $verbose = 1.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.package }}
          # Only this run's upgrade-test and release jobs read the packages, so one day is enough;
          # the repository is private and artifacts count against the account's Actions storage
          # (500 MB on GitHub Free), which 90 days of 230 MB desktop builds filled on 2026-10-14.
          retention-days: 1
          path: |
            build/*.deb
            build/*.ddeb
            build/*.dsc
            build/*.tar.*
            build/*.changes
            build/*.buildinfo
            build/logs/*.build
          if-no-files-found: warn

  upgrade-test:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Download every package's artifact
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: build
          merge-multiple: true

      - name: Install tools
        run: |
          sudo apt-get update
          # dpkg-dev: dpkg-scanpackages writes the index of the freshly built packages for apt in the chroot.
          sudo apt-get install -y --no-install-recommends mmdebstrap uidmap ubuntu-keyring dpkg-dev curl
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Upgrade the published packages to this build
        run: make upgrade-test

      - name: Upload the report and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-test
          path: build/upgrade-test/*.txt
          retention-days: 1
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download every package's artifact
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: build
          merge-multiple: true

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(build/*.deb build/*.dsc build/*.tar.* build/*.changes build/*.buildinfo)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Packages built by CI from $GITHUB_SHA"
          ((${#files[@]})) && gh release upload --clobber "$GITHUB_REF_NAME" "${files[@]}"
