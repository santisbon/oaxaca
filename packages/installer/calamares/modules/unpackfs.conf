# The installed system's layer of the medium, copied whole: casper/filesystem.squashfs is the
# desktop without the live session's packages, which are in casper/filesystem.live.squashfs, a
# layer this step leaves out (docs/7, choice 55). casper mounts the ISO at /cdrom.
---
unpack:
    -   source: "/cdrom/casper/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
