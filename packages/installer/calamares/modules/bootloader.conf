# GRUB on EFI, through Ubuntu's grub-install, which installs the Microsoft-signed shim and
# Canonical-signed grubx64.efi so the system boots with Secure Boot on (policy). The EFI
# directory must be "ubuntu": Ubuntu's signed grubx64.efi is built with the prefix
# /EFI/ubuntu (grub2's debian/build-efi-images, "-p /EFI/$efi_vendor"), so it looks for its
# grub.cfg stub there and nowhere else; Calamares's own bootloader.conf notes the same for
# Debian's "debian".
---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelName: "vmlinuz"
kernelPattern: "^vmlinuz.*"
initramfsName: "initrd.img"
initramfsPattern: "^initr.*"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "ubuntu"
# false: Calamares's own copy to EFI/BOOT/BOOTX64.EFI overwrote the previous system's fallback
# loader on a shared EFI System Partition (Legion laptop, 2026-10-12). This setting stops only
# Calamares's copy: Ubuntu's grub-install writes EFI/BOOT on every run too, unless given
# --no-extra-removable, which grub's postinst passes only when debconf's
# grub2/no_efi_extra_removable is true (docs/7, choice 56).
installEFIFallback: false
