# Generated from packages/installer/calamares/modules/welcome.conf.in by scripts/render.py. Edit the .in file, not this one.
# Requirements checked before the installer starts. The storage figure is the desktop root
# filesystem (3.5 GB) with room for the installed system's updates and a user's files.
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
requirements:
    requiredStorage:    20
    requiredRam:        4
    # No internet check (docs/7, choice 63): an install without a network is complete (choices
    # 18, 20 and 41: the medium's pool carries the NVIDIA driver and the hardware packages), so a
    # missing network is not a failed requirement. Without a network, apt's package lists come
    # with the installed system's first update (shellprocess_system.conf). Calamares shows every
    # unmet "check" entry with a warning sign under "This computer does not satisfy some of the
    # recommended requirements", which read as an error on a machine that was fine.
    check:
        - storage
        - ram
        - power
        - root
    required:
        - root
        - storage
        - ram
geoip:
    style:  "none"
