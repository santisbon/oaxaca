# Generated from packages/installer/calamares/modules/shellprocess_hardware.conf.in by scripts/render.py. Edit the .in file, not this one.
# shellprocess@hardware: from the live system (dontChroot), after the drivers step: install the
# hardware package for this machine's model into the target, such as oaxaca-hw-legion on the
# Lenovo Legion Pro 7 (hardware-install's header). From the live system because the packages
# step has removed this installer's files from the target by now. The leading "-" keeps a
# failure from aborting the installation; the target keeps the log in
# /var/log/oaxaca/hardware-install.log. ${ROOT} is the target.
---
dontChroot: true
timeout: 1800
script:
    - "-/usr/libexec/oaxaca/hardware-install ${ROOT}"
