# Generated from packages/installer/calamares/modules/shellprocess_drivers.conf.in by scripts/render.py. Edit the .in file, not this one.
# NVIDIA: oaxaca-drivers-install (step 4) asks ubuntu-drivers what the machine needs and
# installs the newest open driver branch with prebuilt signed modules; it does nothing on a
# machine without an NVIDIA GPU. The leading "-" keeps a failure (no network, no driver yet
# for a brand-new GPU) from aborting the installation.
---
dontChroot: false
timeout: 1800
script:
    - "-oaxaca-drivers-install"
