# /etc/default/grub for the installed system: Ubuntu's defaults with the boot splash on.
---
overwrite: false
# false: with true, Calamares 3.3.14's grubcfg copies the GRUB_DISTRIBUTOR value already in the
# target's /etc/default/grub, Ubuntu's shell expression that reads /etc/os-release, and writes it
# back between single quotes, so grub-mkconfig never evaluates it and the menu entry reads
# "`( . /etc/os-release && echo ${NAME} )` GNU/Linux" (Legion laptop, 2026-10-12; main.py lines
# 260-286). With false, the branding's bootloaderEntryName is written instead.
keep_distributor: false
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
    GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash"
    # os-prober lists other systems whose root GRUB can read (an unencrypted root); a system
    # with an encrypted root is reached through the entry keep-previous-loader writes instead.
    GRUB_DISABLE_OS_PROBER: false
