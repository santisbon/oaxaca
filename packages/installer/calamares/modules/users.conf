# The first user: Ubuntu's groups for a desktop user (as Lubuntu 26.10 configures them), no
# autologin and no root password (policy: password login, sudo through the sudo group).
---
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - sudo
    # video: the backlight udev rule of the session package gives this group write access to
    # /sys/class/backlight/*/brightness, which brightnessctl (the port's brightness command)
    # writes directly; Ubuntu's brightnessctl ships no rule and no logind support (2026-10-11).
    - video
passwordRequirements:
    minLength: 8
    maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names:
    - root
    - daemon
    - bin
    - sys
    - sync
    - games
    - man
    - lp
    - mail
    - news
    - nobody
