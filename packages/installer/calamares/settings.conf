# Generated from packages/installer/calamares/settings.conf.in by scripts/render.py. Edit the .in file, not this one.
# Calamares settings for installing Oaxaca (calamares 3.3.14-0ubuntu30, stonking).
# Module configurations live beside this file in modules/; every module named below reads
# modules/<name>.conf, and an instance "shellprocess@system" reads modules/shellprocess_system.conf.
# The sequence follows Lubuntu's 26.10 settings (calamares-settings-lubuntu 1:26.10.7) where
# Ubuntu-specific, with initramfs-tools in place of dracut, since the base image builds its
# initramfs with initramfs-tools (step 3).
---
modules-search: [ local ]

instances:
- id: system
  module: shellprocess
  config: shellprocess_system.conf
- id: snapshots
  module: shellprocess
  config: shellprocess_snapshots.conf
- id: drivers
  module: shellprocess
  config: shellprocess_drivers.conf
- id: hardware
  module: shellprocess
  config: shellprocess_hardware.conf
- id: loader
  module: shellprocess
  config: shellprocess_loader.conf
- id: fallback
  module: shellprocess
  config: shellprocess_fallback.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initramfscfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@snapshots
  - packages
  - shellprocess@system
  - shellprocess@drivers
  - shellprocess@hardware
  - shellprocess@loader
  - grubcfg
  - bootloader
  - shellprocess@fallback
  - initramfs
  - umount
- show:
  - finished

branding: oaxaca
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
