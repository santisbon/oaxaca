# Generated from packages/base/apt-unattended-upgrades.conf.in by scripts/render.py. Edit the .in file, not this one.
// Installed by oaxaca-base as /etc/apt/apt.conf.d/51oaxaca-unattended-upgrades.
//
// Ubuntu's 50unattended-upgrades (a conffile of the unattended-upgrades package, left as
// shipped) lists the origins it may upgrade from as "${distro_id}:${distro_codename}-security"
// and friends. unattended-upgrade fills ${distro_id} from "lsb_release -i -s", and on
// stonking lsb_release is a shell script that reads /etc/os-release, which this package
// diverts to say ID=oaxaca. So those entries resolve to "Oaxaca:stonking-security",
// an origin nothing publishes, and no Ubuntu security update would ever be installed
// unattended (found 2026-10-11, roadmap step 8). Ubuntu's archive keeps "Origin: Ubuntu".
//
// #clear is the only way to replace an apt list (apt.conf(5)); a later file can only append.
// The list below is Ubuntu's own with the literal name, and nothing more: the distro's own
// archive ("Origin: Oaxaca", suite stonking) is left out on purpose, so the desktop's
// packages move only through "oaxaca-update", which runs their migrations afterwards.
#clear Unattended-Upgrade::Allowed-Origins;
Unattended-Upgrade::Allowed-Origins {
	"Ubuntu:stonking";
	"Ubuntu:stonking-security";
	"UbuntuESMApps:stonking-apps-security";
	"UbuntuESM:stonking-infra-security";
};
