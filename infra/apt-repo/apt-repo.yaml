AWSTemplateFormatVersion: "2010-09-09"
# The distro's apt repository (dists/ and pool/): an S3 bucket holding the files, a CloudFront
# distribution serving them over HTTPS at the repository's own host name (APT_HOST in
# distro.conf), the TLS certificate for that name, and the DNS records pointing the name at the
# distribution. Deployed by scripts/apt-infra.sh (make apt-infra); filled by
# scripts/repo-publish.sh (make publish). See infra/apt-repo/README.md.
#
# The stack must be in us-east-1: CloudFront only uses ACM certificates from that region.
Description: S3 bucket and CloudFront distribution for an apt repository at its own host name

Parameters:
  BucketName:
    Type: String
    Description: The bucket's globally unique name (APT_S3_BUCKET in distro.conf)
  HostName:
    Type: String
    Description: The repository's host name, such as apt.example.org (APT_HOST in distro.conf)
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 hosted zone of the host name's domain (APT_DOMAIN in distro.conf)
  PublicRead:
    Type: String
    AllowedValues: ["true", "false"]
    Description: >-
      "true" lets anyone read objects at the bucket's own REST endpoint as well as through
      CloudFront; "false" leaves CloudFront as the only reader (APT_S3_PUBLIC_READ in distro.conf)
  WafAction:
    Type: String
    AllowedValues: [count, block]
    Description: >-
      What the web ACL's rules do with a matching request: "count" only records it (to review the
      matches first), "block" refuses it (WAF_ACTION in the settings file)
  WafRateLimit:
    Type: Number
    MinValue: 100
    Description: The most requests one IP address may make in 5 minutes before the rate rule matches (WAF_RATE_LIMIT in the settings file)

Conditions:
  WafBlocks: !Equals [!Ref WafAction, block]
  IsPublicRead: !Equals [!Ref PublicRead, "true"]

Resources:
  # AWS WAF for the distribution (a web ACL for CloudFront, which lives in us-east-1): AWS's managed
  # list of IP addresses known for bots and attacks, AWS's managed rules for known exploit patterns
  # in requests (such as Log4j probes), and a per-IP rate limit over 5 minutes. With WafAction
  # "count" every rule only records its matches, in CloudWatch metrics and sampled requests; with
  # "block" they refuse them. The web ACL is this distribution's own, as CloudFront's flat-rate
  # pricing plans require one on each subscribed distribution.
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-waf"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-waf"
      Rules:
        - Name: ip-reputation
          Priority: 0
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          OverrideAction: !If [WafBlocks, {None: {}}, {Count: {}}]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ip-reputation
        - Name: known-bad-inputs
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction: !If [WafBlocks, {None: {}}, {Count: {}}]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: known-bad-inputs
        - Name: rate-per-ip
          Priority: 2
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: !Ref WafRateLimit
              EvaluationWindowSec: 300
          Action: !If [WafBlocks, {Block: {}}, {Count: {}}]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-per-ip

  Bucket:
    Type: AWS::S3::Bucket
    # Kept when the stack is deleted: the bucket holds the published repository, which installed
    # systems read; removing it is a separate, deliberate step (README, "Teardown").
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      # Objects belong to the bucket owner and ACLs are off; who may read comes from the bucket
      # policy below alone.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Public ACLs stay blocked. A public bucket policy is allowed only when PublicRead is
      # "true"; with "false", S3 itself refuses any policy that would make the bucket public.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: !If [IsPublicRead, false, true]
        RestrictPublicBuckets: !If [IsPublicRead, false, true]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The distribution reads objects, signing its requests through the origin access
          # control below; the condition limits the grant to this one distribution.
          - Sid: CloudFrontReadObjects
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${Bucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          # Only when PublicRead is "true": anyone may also read objects at the bucket's REST
          # endpoint. With "false", the distribution above is the bucket's only reader.
          - !If
            - IsPublicRead
            - Sid: PublicReadObjects
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${Bucket}/*"
            - !Ref AWS::NoValue
          # Plain HTTP refused.
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${Bucket}"
              - !Sub "arn:${AWS::Partition}:s3:::${Bucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # The TLS certificate for the host name, validated through a DNS record ACM adds to the hosted
  # zone itself; the stack's creation waits until the validation completes.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref HostName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref HostName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${BucketName}-oac"
        Description: CloudFront signs its requests to the apt repository's bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        WebACLId: !GetAtt WebACL.Arn
        Comment: !Sub "apt repository at ${HostName}"
        Enabled: true
        Aliases:
          - !Ref HostName
        HttpVersion: http2and3
        IPV6Enabled: true
        # Every edge location, so each viewer gets the nearest one: under CloudFront's Free flat-rate
        # plan, data transfer is not billed per GB, so the cheaper classes would only be slower (docs/7, choice 62).
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: bucket
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        # pool/ and everything else: cached at the edge (AWS's managed CachingOptimized policy,
        # one day by default). A file's name in pool/ carries its package's name, version and
        # architecture, and repo-publish.sh refuses new content under a published name, so a
        # cached copy is never out of date.
        DefaultCacheBehavior:
          TargetOriginId: bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: false
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # dists/: never cached (AWS's managed CachingDisabled policy). apt checks every index
        # against the hashes in InRelease, and a publish rewrites them all together, so an
        # InRelease and a Packages file cached from different publishes would fail apt's check.
        CacheBehaviors:
          - PathPattern: dists/*
            TargetOriginId: bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

  # The host name points at the distribution over IPv4 and IPv6. Z2FDTNDATAQYW2 is the hosted
  # zone ID Route 53 uses for every CloudFront distribution's alias target.
  RecordIPv4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref HostName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  RecordIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref HostName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  RepositoryUrl:
    Description: The apt repository's URL (APT_URL in distro.conf)
    Value: !Sub "https://${HostName}"
  DistributionDomainName:
    Description: The distribution's own domain name, which the host name's records point at
    Value: !GetAtt Distribution.DomainName
  BucketRestUrl:
    Description: The bucket's REST endpoint, readable by anyone only when PublicRead is "true"
    Value: !Sub "https://${Bucket}.s3.${AWS::Region}.amazonaws.com"
