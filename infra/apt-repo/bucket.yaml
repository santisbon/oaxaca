AWSTemplateFormatVersion: "2010-09-09"
# The S3 bucket that serves the distro's apt repository (dists/ and pool/), read by apt over HTTPS
# at the bucket's REST endpoint, https://<bucket>.s3.<region>.amazonaws.com. Deployed by
# scripts/apt-infra.sh (make apt-infra); filled by scripts/repo-publish.sh (make publish).
# See infra/apt-repo/README.md.
Description: Public, read-only S3 bucket for an apt repository

Parameters:
  BucketName:
    Type: String
    Description: The bucket's globally unique name (APT_S3_BUCKET in distro.conf)

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    # Kept when the stack is deleted: the bucket holds the published repository, which installed
    # systems read; removing it is a separate, deliberate step (README, "Teardown").
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      # Objects belong to the bucket owner and ACLs are off; public read comes from the bucket
      # policy below alone.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Public ACLs stay blocked; a public bucket policy is allowed, since the policy is how the
      # repository is readable by anyone.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Anyone may read objects; nothing else is public (no listing, no writes).
          - Sid: PublicReadObjects
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${Bucket}/*"
          # Plain HTTP refused: apt's sources entry uses https.
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${Bucket}"
              - !Sub "arn:${AWS::Partition}:s3:::${Bucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  RepositoryUrl:
    Description: The apt repository's URL (APT_URL in distro.conf)
    Value: !Sub "https://${Bucket}.s3.${AWS::Region}.amazonaws.com"
